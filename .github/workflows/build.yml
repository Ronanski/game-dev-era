name: Test and Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache
          cd ~/godot-cache
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Install Godot
        run: |
          cd ~/godot-cache
          unzip -o -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $tpl
          unzip -o -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* $tpl/
          godot --version

      - name: Configure Android signing (debug key)
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${GODOT_VERSION}.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Validate story data
        run: godot --headless --path . -s tests/validate_data.gd

      - name: Automated playthroughs (all endings)
        run: |
          for route in best partial war hiraya late; do
            godot --headless --path . -s tests/playthrough.gd -- --route=$route 2>&1 \
              | grep -v 'Parameter "m" is null\|mesh_storage.h' | tee /tmp/run.log
            grep -q "RESULT: PASS" /tmp/run.log
          done

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/AlamatNgHulingBuwan.exe
          ls -la build/windows

      - name: Export Android (APK)
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/AlamatNgHulingBuwan.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: AlamatNgHulingBuwan-Windows
          path: build/windows

      - uses: actions/upload-artifact@v4
        with:
          name: AlamatNgHulingBuwan-Android
          path: build/android/*.apk

      - name: Publish release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/AlamatNgHulingBuwan.exe
            build/android/AlamatNgHulingBuwan.apk
